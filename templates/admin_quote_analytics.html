<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quote Analytics — Redstone PDM</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --navy: #1a2332;
    --navy-light: #2a3548;
    --grey-bg: #eef0f4;
    --card-bg: #ffffff;
    --border: #e2e5eb;
    --text-dark: #1a2332;
    --text-grey: #6b7280;
    --green: #0f9d58;
    --green-bg: #e8f7ee;
    --red: #c0392b;
    --red-bg: #fdecea;
    --amber: #b8860b;
    --amber-bg: #fdf3e0;
    --blue: #2b6cb0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--grey-bg); color: var(--text-dark);
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 24px; }

  .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
  .page-header h1 { font-size: 22px; margin: 0; }
  .page-header p { margin: 4px 0 0; color: var(--text-grey); font-size: 13px; }

  .filter-bar {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .filter-bar label { font-size: 12px; color: var(--text-grey); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .filter-bar select, .filter-bar input[type=month], .filter-bar input[type=number] {
    padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; background: #fff;
  }
  .filter-group { display: flex; align-items: center; gap: 8px; }

  .tile-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 16px; }
  @media (max-width: 900px) { .tile-grid { grid-template-columns: repeat(2, 1fr); } }

  .tile {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px;
  }
  .tile-label { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--text-grey); margin-bottom: 8px; }
  .tile-value { font-size: 24px; font-weight: 700; line-height: 1.15; }
  .tile-sub { font-size: 13px; color: var(--text-grey); margin-top: 4px; }
  .tile.won { background: var(--green-bg); }
  .tile.won .tile-value { color: var(--green); }
  .tile.lost { background: var(--red-bg); }
  .tile.lost .tile-value { color: var(--red); }
  .tile.cancelled { background: var(--amber-bg); }
  .tile.cancelled .tile-value { color: var(--amber); }
  .tile.declined .tile-value { color: var(--text-grey); }
  .tile.winrate .tile-value { color: var(--blue); }

  .section-title { font-size: 16px; font-weight: 700; margin: 28px 0 12px; }

  .panel {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 20px;
  }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    background: var(--navy); color: #fff; text-align: left; padding: 10px 14px;
    font-size: 11px; text-transform: uppercase; letter-spacing: .03em; font-weight: 700;
  }
  thead th.num { text-align: right; }
  tbody td { padding: 10px 14px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: #f7f8fa; cursor: pointer; }
  tbody tr.active-row { background: #eaf1fb; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; text-transform: lowercase; }
  .pill.won { background: var(--green-bg); color: var(--green); }
  .pill.lost { background: var(--red-bg); color: var(--red); }
  .pill.cancelled, .pill.won_then_cancelled { background: var(--amber-bg); color: var(--amber); }
  .pill.declined_to_quote { background: #eee; color: var(--text-grey); }

  .empty-state { padding: 30px; text-align: center; color: var(--text-grey); font-size: 13px; }
  .loading { padding: 30px; text-align: center; color: var(--text-grey); font-size: 13px; }
  .muted { color: var(--text-grey); }
  .note-banner {
    background: #fff8e1; border: 1px solid #ffe082; color: #8a6d00; font-size: 12px;
    padding: 8px 14px; border-radius: 6px; margin-bottom: 16px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="page-header">
    <div>
      <h1>Quote Analytics</h1>
      <p>Full pipeline, win/loss, and cost picture across every quote — filter by period and pub.</p>
    </div>
  </div>

  <div class="filter-bar">
    <div class="filter-group">
      <label>Period</label>
      <select id="periodSelect">
        <option value="all">All-time</option>
        <option value="month">Month</option>
        <option value="year">Year</option>
      </select>
    </div>
    <div class="filter-group" id="monthGroup" style="display:none">
      <input type="month" id="monthInput">
    </div>
    <div class="filter-group" id="yearGroup" style="display:none">
      <input type="number" id="yearInput" min="2020" max="2035" style="width:90px">
    </div>
    <div class="filter-group">
      <label>Pub</label>
      <select id="pubSelect"><option value="">All pubs</option></select>
    </div>
  </div>

  <div id="tilesArea">
    <div class="loading">Loading…</div>
  </div>

  <div class="section-title">By Pub</div>
  <div class="panel">
    <div id="byPubTable" class="loading">Loading…</div>
  </div>

  <div class="section-title">By Trade Type</div>
  <div class="panel">
    <div id="byTradeTable" class="loading">Loading…</div>
  </div>

  <div class="section-title">Last 12 Months</div>
  <div class="panel">
    <div id="byPeriodTable" class="loading">Loading…</div>
  </div>

</div>

<script>
const money = v => '£' + Number(v || 0).toLocaleString('en-GB', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const num   = v => Number(v || 0).toLocaleString('en-GB');

function currentFilters() {
  const period = document.getElementById('periodSelect').value;
  const params = new URLSearchParams({ period });
  if (period === 'month') {
    const m = document.getElementById('monthInput').value;
    if (m) params.set('month', m);
  } else if (period === 'year') {
    const y = document.getElementById('yearInput').value;
    if (y) params.set('year', y);
  }
  const pub = document.getElementById('pubSelect').value;
  if (pub) params.set('pub', pub);
  return params;
}

function renderTiles(t) {
  const timingSub = t.avg_release_to_submit_days !== null
    ? `${t.avg_release_to_submit_days} days avg (${t.avg_release_to_submit_sample} sample${t.avg_release_to_submit_sample===1?'':'s'})`
    : 'Not enough data yet';

  document.getElementById('tilesArea').innerHTML = `
    <div class="tile-grid">
      <div class="tile">
        <div class="tile-label">Pipeline / Awaiting Approval</div>
        <div class="tile-value">${num(t.pipeline.count)}</div>
        <div class="tile-sub">${money(t.pipeline.value)}</div>
      </div>
      <div class="tile won">
        <div class="tile-label">Won</div>
        <div class="tile-value">${num(t.won.count)}</div>
        <div class="tile-sub">${money(t.won.value)}</div>
      </div>
      <div class="tile lost">
        <div class="tile-label">Lost</div>
        <div class="tile-value">${num(t.lost.count)}</div>
        <div class="tile-sub">${money(t.lost.value)}</div>
      </div>
      <div class="tile cancelled">
        <div class="tile-label">Cancelled (won then cancelled)</div>
        <div class="tile-value">${num(t.cancelled.count)}</div>
        <div class="tile-sub">${money(t.cancelled.value)}</div>
      </div>
      <div class="tile declined">
        <div class="tile-label">Declined to Quote</div>
        <div class="tile-value">${num(t.declined.count)}</div>
        <div class="tile-sub">${money(t.declined.value)}</div>
      </div>
      <div class="tile winrate">
        <div class="tile-label">Win Rate</div>
        <div class="tile-value">${t.win_rate}%</div>
        <div class="tile-sub">Won ÷ (Won+Lost+Cancelled)</div>
      </div>
    </div>
    <div class="tile-grid">
      <div class="tile">
        <div class="tile-label">Quotes Awaiting Submission</div>
        <div class="tile-value">${num(t.awaiting_submission.count)}</div>
        <div class="tile-sub">Not yet surveyed/quoted</div>
      </div>
      <div class="tile">
        <div class="tile-label">Avg Released &rarr; Quote Submitted</div>
        <div class="tile-value">${t.avg_release_to_submit_days !== null ? t.avg_release_to_submit_days + ' days' : '—'}</div>
        <div class="tile-sub">${timingSub}</div>
      </div>
      <div class="tile">
        <div class="tile-label">Survey Travel Cost</div>
        <div class="tile-value">${money(t.survey_travel_cost.value)}</div>
        <div class="tile-sub">${num(t.survey_travel_cost.count)} survey(s), 45p/mile</div>
      </div>
      <div class="tile">
        <div class="tile-label">Labour Cost</div>
        <div class="tile-value">${money(t.labour_cost.value)}</div>
        <div class="tile-sub">${num(t.labour_cost.count)} survey(s) timed</div>
      </div>
      <div class="tile">
        <div class="tile-label">Parking Cost</div>
        <div class="tile-value">${money(t.parking_cost.value)}</div>
        <div class="tile-sub">${num(t.parking_cost.count)} survey(s)</div>
      </div>
    </div>
  `;
}

function renderByPub(rows) {
  const el = document.getElementById('byPubTable');
  if (!rows.length) { el.innerHTML = '<div class="empty-state">No quotes recorded for this period.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Pub</th><th class="num">Quotes</th><th class="num">Won</th><th class="num">Won £</th>
        <th class="num">Lost</th><th class="num">Lost £</th><th class="num">Cancelled</th>
        <th class="num">Cancelled £</th><th class="num">Declined</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${r.pub_name}</td>
            <td class="num">${num(r.total_quotes)}</td>
            <td class="num">${num(r.won_count)}</td>
            <td class="num">${money(r.won_value)}</td>
            <td class="num">${num(r.lost_count)}</td>
            <td class="num">${money(r.lost_value)}</td>
            <td class="num">${num(r.cancelled_count)}</td>
            <td class="num">${money(r.cancelled_value)}</td>
            <td class="num">${num(r.declined_count)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderByTrade(rows) {
  const el = document.getElementById('byTradeTable');
  if (!rows.length) { el.innerHTML = '<div class="empty-state">No quotes recorded for this period.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Trade Type</th><th class="num">Quotes</th><th class="num">Won</th><th class="num">Won £</th>
        <th class="num">Lost</th><th class="num">Lost £</th><th class="num">Cancelled</th>
        <th class="num">Cancelled £</th><th class="num">Declined</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${r.trade_type}</td>
            <td class="num">${num(r.total_quotes)}</td>
            <td class="num">${num(r.won_count)}</td>
            <td class="num">${money(r.won_value)}</td>
            <td class="num">${num(r.lost_count)}</td>
            <td class="num">${money(r.lost_value)}</td>
            <td class="num">${num(r.cancelled_count)}</td>
            <td class="num">${money(r.cancelled_value)}</td>
            <td class="num">${num(r.declined_count)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function renderByPeriod(rows) {
  const el = document.getElementById('byPeriodTable');
  if (!rows.length) { el.innerHTML = '<div class="empty-state">No quote history in the last 12 months.</div>'; return; }
  el.innerHTML = `
    <table>
      <thead><tr>
        <th>Month</th><th class="num">Total Quotes</th><th class="num">Won</th>
        <th class="num">Lost</th><th class="num">Cancelled</th><th class="num">Declined</th>
      </tr></thead>
      <tbody>
        ${rows.map(r => `
          <tr>
            <td>${r.month}</td>
            <td class="num">${num(r.total_quotes)}</td>
            <td class="num">${num(r.won_count)}</td>
            <td class="num">${num(r.lost_count)}</td>
            <td class="num">${num(r.cancelled_count)}</td>
            <td class="num">${num(r.declined_count)}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

let pubListLoaded = false;

async function loadData() {
  const params = currentFilters();
  try {
    const res = await fetch('/api/quote-analytics/data?' + params.toString());
    const data = await res.json();
    if (data.error) {
      document.getElementById('tilesArea').innerHTML = `<div class="empty-state">Error loading data: ${data.error}</div>`;
      return;
    }
    renderTiles(data.tiles);
    renderByPub(data.by_pub);
    renderByTrade(data.by_trade);
    renderByPeriod(data.by_period);

    if (!pubListLoaded) {
      const sel = document.getElementById('pubSelect');
      data.pub_list.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p; opt.textContent = p;
        sel.appendChild(opt);
      });
      pubListLoaded = true;
    }
  } catch (err) {
    document.getElementById('tilesArea').innerHTML = `<div class="empty-state">Could not load Quote Analytics data. Try refreshing.</div>`;
  }
}

document.getElementById('periodSelect').addEventListener('change', e => {
  document.getElementById('monthGroup').style.display = e.target.value === 'month' ? 'flex' : 'none';
  document.getElementById('yearGroup').style.display = e.target.value === 'year' ? 'flex' : 'none';
  loadData();
});
document.getElementById('monthInput').addEventListener('change', loadData);
document.getElementById('yearInput').addEventListener('change', loadData);
document.getElementById('pubSelect').addEventListener('change', loadData);

// Sensible defaults: current month pre-filled in the month picker even
// though 'All-time' is selected by default, so switching to Month doesn't
// start on an empty field.
(function initDefaults() {
  const now = new Date();
  const ym = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
  document.getElementById('monthInput').value = ym;
  document.getElementById('yearInput').value = now.getFullYear();
})();

loadData();
</script>
</body>
</html>
